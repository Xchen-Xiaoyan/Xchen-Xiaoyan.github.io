<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陈笑颜 · 成长地图</title>
  <meta name="description" content="陈笑颜的作品集:一张手绘成长地图,每个地点对应一段真实的数据分析、机器学习与产品经历。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbf5e6'/%3E%3Cpath d='M12 44 Q24 20 36 38 T54 22' fill='none' stroke='%232b2a33' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='54' cy='22' r='6' fill='%23e8833a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#map-title" id="skip">跳到地图</a>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
  </svg>

  <header class="top">
    <span class="brand" id="brand"></span>
    <nav class="top-nav" aria-label="Site">
      <button type="button" class="link-btn" id="nav-all"></button>
      <button type="button" class="link-btn" id="nav-contact"></button>
      <button type="button" class="lang" id="lang"></button>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="map-shell" id="map-shell">
      <div class="intro" id="intro">
        <p class="kicker" id="kicker"></p>
        <h1 id="map-title" tabindex="-1"></h1>
        <p class="lede" id="lede"></p>
        <p class="hint" id="hint"></p>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-start"></button>
          <button type="button" class="btn" id="btn-all"></button>
          <button type="button" class="btn" id="btn-contact"></button>
        </div>
      </div>

        <div class="map" id="map"></div>
      </div>
    </section>

    <section class="contact" id="contact" tabindex="-1" aria-labelledby="contact-title">
      <h2 id="contact-title"></h2>
      <p id="contact-text"></p>
      <ul class="contact-links" id="contact-links"></ul>
    </section>
  </main>

  <footer class="foot" id="foot"></footer>

  <!-- 详情面板:桌面端为右侧面板,手机端为底部面板 -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" role="dialog" aria-labelledby="panel-title" inert>
    <div class="grab" aria-hidden="true"></div>
    <div class="panel-bar">
      <button type="button" class="nav-btn" id="prev"></button>
      <span class="count" id="count" aria-live="off"></span>
      <button type="button" class="nav-btn" id="next"></button>
      <button type="button" class="x-btn" id="close"></button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- 全部经历:按时间排序 -->
  <dialog class="log" id="log" aria-labelledby="log-title">
    <div class="log-head">
      <div>
        <h2 id="log-title"></h2>
        <p id="log-hint"></p>
      </div>
      <button type="button" class="x-btn" id="log-close"></button>
    </div>
    <ol class="log-list" id="log-list"></ol>
  </dialog>

  <div class="sr-only" id="live" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
